# ====================================================================
# Confirmation Dialog
# ====================================================================
shops.confirm.title=Confirm Purchase
shops.confirm.content=This market has indicated that you wish to purchase this item for <#F7FFC9><arg:0></#F7FFC9>. Are you sure about this?
shops.confirm.player_stock=<b><red>You can purchase this item <#CEFACF<arg:0></#CEFACF more times.
shops.confirm.button.yes=Yes
shops.confirm.button.no=No

# ====================================================================
# Create Market Dialog
# ====================================================================
shops.create.title=Market Editor
shops.create.description=Create or edit a market by configuring the name, size, and content slots. After submitting this form, you'll be taken to the inventory editor where you can add borders and pagination to the market.
shops.create.input.name=Market Name
shops.create.input.size=Size (9..54)
shops.create.input.slots=Content Slots (e.g. 10-16 or 10,11,12)
shops.create.button.submit=Submit
shops.create.button.cancel=Cancel
shops.create.error.empty_name=Market name cannot be empty.
shops.create.error.exists=A market with that key already exists.
shops.create.error.invalid_slots=Could not parse the content slots. Use ranges like 10-16 or a comma-separated list.
shops.create.error.no_slots=Specify at least one content slot.

# ====================================================================
# Market Creator (inventory step after Create dialog)
# ====================================================================
shops.market.creator.previous=(?i)\\b(previous|back)\\b
shops.market.creator.next=(?i)\\b(next|forward)\\b
shops.market.creator.close=(?i)\\b(close|cancel)\\b

# ====================================================================
# Add Market Item Dialog
# ====================================================================
shops.additem.title=Add Item to Market
shops.additem.description=Configure the currency, product, and stock for this item.

# --- Main dialog inputs ---
shops.additem.input.currency=Currency Type
shops.additem.input.product=Product Type
shops.additem.input.product_value=Product Details (leave blank for shop items)
shops.additem.input.player_stock=Per-Player Stock
shops.additem.input.global_stock=Global Stock
shops.additem.input.index=Position

# --- Currency type labels (dropdown options) ---
shops.additem.currency.money=Money
shops.additem.currency.itemstack=Item from inventory
shops.additem.currency.lumaitems=LumaItem

# --- Product type labels (dropdown options) ---
shops.additem.product.shop_item=Give the shop item
shops.additem.product.command=Run a command
shops.additem.product.lumaitems=Give a LumaItem

# --- Buttons ---
shops.additem.button.continue=Continue
shops.additem.button.cancel=Cancel
shops.additem.button.submit=Submit

# --- Errors / success ---
shops.additem.error.incomplete=Please select a currency and product type.
shops.additem.error.bad_product=That product type requires a value. Fill in the Product Details field.
shops.additem.error.bad_lumaitem_key=LumaItem key cannot be empty.
shops.additem.error.save=Failed to save the item: <arg:0>
shops.additem.success=Added <arg:0> to the market.

# --- Money sub-dialog ---
shops.additem.money.title=Set Price (Money)
shops.additem.money.amount=Amount

# --- LumaItem sub-dialog ---
shops.additem.lumaitem.title=Set Price (LumaItem)
shops.additem.lumaitem.key=LumaItem Key
shops.additem.lumaitem.amount=Amount


shops.additem.itemstack.title=<red>Pick Item
shops.additem.itemstack.subtitle=<yellow>Click an item.
shops.additem.itemstack.timeout=Item pick timed out. Returning to add-item dialog.
shops.additem.itemstack.confirm_title=Confirm Currency Item
shops.additem.itemstack.confirm_body=Use this item as the currency? You can set the amount required below.
shops.additem.itemstack.confirm=Use this item
shops.additem.itemstack.repick=Pick again
shops.additem.itemstack.amount=Amount required

